<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — BM TYRES & RIMS EXPRESS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#d32f2f',
            jet: '#111111',
            metal: '#b0bec5',
            lightbg: '#f5f5f5'
          }
        }
      }
    }
  </script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#d32f2f" />
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-lightbg text-gray-900 antialiased">

  <!-- simple nav -->
  <header class="bg-jet text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center font-bold">BM</div>
        <div>
          <h1 class="text-lg font-bold">BM TYRES & RIMS EXPRESS</h1>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="shop.html" class="hover:underline">Shop</a>
        <a href="about.html" class="hover:underline">About</a>
        <a href="contact.html" class="hover:underline">Contact</a>
        <a href="https://wa.me/254714512412?text=Hi%20I%20want%20to%20order" class="ml-4 px-3 py-2 bg-primary rounded text-white font-semibold">Order on WhatsApp</a>
      </nav>

      <div class="md:hidden">
        <button id="menuBtnShop" class="p-2 bg-white/10 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
    <div id="mobileMenuShop" class="md:hidden bg-jet text-white hidden">
      <div class="px-4 py-3 flex flex-col gap-2">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="https://wa.me/254714512412?text=Hi%20I%20want%20to%20order" class="mt-2 px-3 py-2 bg-primary rounded text-white font-semibold">Order on WhatsApp</a>
      </div>
    </div>
  </header>

  <!-- shop content -->
  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Shop — Tyres & Rims</h1>
      <div class="flex items-center gap-3">
        <select id="typeFilter" class="p-2 border rounded">
          <option value="All">All</option>
          <option value="Tyre">Tyres</option>
          <option value="Rim">Rims</option>
        </select>
        <input id="searchInput" type="search" placeholder="Search brand or model" class="p-2 border rounded" />
      </div>
    </div>

    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- products injected by script.js -->
    </div>
  </main>

  <!-- modal for product details -->
  <div id="productModalBackdrop" class="fixed inset-0 bg-black/40 hidden z-40 items-center justify-center p-4">
    <div id="productModal" class="bg-white rounded-lg max-w-2xl w-full p-6 shadow">
      <button id="productModalClose" class="ml-auto block text-gray-500">Close ✕</button>
      <div id="productModalContent" class="mt-2"></div>
    </div>
  </div>

  <!-- floating WhatsApp & install -->
  <a id="whatsAppFloatShop" href="https://wa.me/254714512412?text=Hi%20BM%20Tyres%20I%20want%20to%20order" target="_blank" class="fixed right-4 bottom-24 z-50">
    <div class="w-14 h-14 rounded-full bg-[#25D366] shadow-lg flex items-center justify-center text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor"><path d="M20.52 3.48A11.9 11.9 0 0012 .5 11.9 11.9 0 003.48 3.48 11.9 11.9 0 00.5 12c0 2.11.55 4.18 1.6 6.04L0 24l5.14-1.66A11.9 11.9 0 0012 23.5c3.18 0 6.16-1.24 8.48-3.52A11.9 11.9 0 0023.5 12c0-3.18-1.24-6.16-3.48-8.52zM12 21a9 9 0 01-4.87-1.43l-.35-.22-3.05.98.98-3.05-.23-.36A9 9 0 1112 21zm5.1-7.4c-.26-.13-1.54-.76-1.78-.84-.24-.09-.41-.13-.58.13s-.66.84-.81 1.01c-.15.17-.3.19-.56.06-.26-.13-1.1-.4-2.09-1.29-.77-.69-1.29-1.55-1.44-1.81-.15-.26-.02-.4.11-.53.11-.11.26-.29.39-.44.13-.15.17-.26.26-.43.09-.17.05-.32-.03-.45-.09-.13-.58-1.4-.8-1.92-.21-.5-.43-.43-.58-.43-.15 0-.33-.01-.5-.01-.17 0-.45.06-.69.33-.24.27-.92.9-.92 2.2 0 1.3.94 2.56 1.07 2.74.13.17 1.86 2.92 4.52 3.98 1.36.56 2.42.9 3.25 1.15.15.05.29.08.39.05.12-.03.36-.13 1.03-.5.66-.37 2.06-1.01 2.36-2 .3-.99.3-1.83.21-2.01-.08-.18-.28-.29-.54-.42z"/></svg>
    </div>
  </a>

  <button id="installBtnFloatShop" title="Install app" class="fixed right-4 bottom-4 z-50 w-12 h-12 rounded-full bg-primary text-white shadow-lg flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m0 0l4-4m-4 4L8 11M4 21h16" />
    </svg>
  </button>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
